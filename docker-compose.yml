services:
  routerllm:
    build: .
    image: routerllm:latest
    container_name: routerllm
    ports:
      - "${ROUTERLLM_PORT:-1765}:${ROUTERLLM_PORT:-1765}"
    volumes:
      - ./routerllm.yaml:/app/routerllm.yaml:ro
      - ./system_prompt.txt:/app/system_prompt.txt:ro
      - ./prompt_routing.txt:/app/prompt_routing.txt:ro
    restart: unless-stopped
    env_file:
      - .env
